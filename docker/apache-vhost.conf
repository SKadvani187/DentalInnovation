<VirtualHost *:80>
    # Storefront (React build) at the site root; PHP backend at /var/www/html/dentinno
    # is reachable at /dentinno. Single origin -> no CORS, no mixed content.
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All        # lets the project's .htaccess files run (SPA fallback + Bearer auth)
        Require all granted
    </Directory>

    ErrorLog  ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
